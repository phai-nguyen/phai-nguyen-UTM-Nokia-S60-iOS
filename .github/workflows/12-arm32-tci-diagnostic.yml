name: UTM-N95-ARM32-TCI-DIAGNOSTIC

# Research-only ARM32 QEMU compile. NEVER builds or overwrites device-tested Lite v8 IPA.
on:
  push:
    branches:
      - research/n95-omap2420-arm32
    paths:
      - .github/workflows/12-arm32-tci-diagnostic.yml
      - scripts/diagnose_qemu_arm32_tci.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n95-arm32-tci-diagnostic
  cancel-in-progress: false

jobs:
  arm32:
    name: Compile ARM32 iOS TCI using pinned UTM sysroot (no IPA)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout research scripts
        uses: actions/checkout@v4

      - name: Checkout exact pinned UTM revision
        uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          ref: 7eadb056ae0f91d979059544d0ddcd2d5a40be92
          path: upstream/UTM
          persist-credentials: false

      - name: Download matching UTM iOS TCI sysroot (original 7 engines)
        uses: actions/download-artifact@v4
        with:
          name: Sysroot-ios-tci-arm64
          repository: utmapp/UTM
          run-id: 36090554968
          github-token: ${{ github.token }}
          path: upstream-artifact

      - name: Install dependencies for ARM32-only QEMU compile
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install meson ninja pkgconf bison gettext glib
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "QEMU_BUILD_TOOLCHAIN=READY"

      - name: Restore pinned sysroot without rebuilding its dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out/arm32-diagnostic/diagnostics
          test -s upstream-artifact/sysroot.tgz
          tar -tzf upstream-artifact/sysroot.tgz > out/arm32-diagnostic/diagnostics/sysroot-file-list.txt
          grep -F 'sysroot-ios-tci-arm64/' out/arm32-diagnostic/diagnostics/sysroot-file-list.txt
          tar -xzf upstream-artifact/sysroot.tgz -C upstream/UTM
          test -d upstream/UTM/sysroot-ios-tci-arm64/Frameworks
          shasum -a 256 upstream-artifact/sysroot.tgz > out/arm32-diagnostic/diagnostics/sysroot-archive.sha256
          echo 'PINNED_SYSROOT=RESTORED'

      - name: Compile qemu-arm-softmmu and inspect experimental framework
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/diagnose_qemu_arm32_tci.sh \
            2>&1 | tee out/arm32-diagnostic/diagnostics/complete-console.log
          grep -Fx 'STATUS=PASS' out/arm32-diagnostic/diagnostics/BUILD-STATUS.txt
          grep -F 'SEVEN_FRAMEWORKS=UNCHANGED' out/arm32-diagnostic/diagnostics/baseline-integrity.txt

      - name: GitHub Actions PASS/FAIL summary
        if: always()
        shell: bash
        run: |
          mkdir -p out/arm32-diagnostic/diagnostics
          STATUS_FILE=out/arm32-diagnostic/diagnostics/BUILD-STATUS.txt
          if test -s "$STATUS_FILE"; then
            cat "$STATUS_FILE"
          else
            echo 'STATUS=FAIL_OR_NOT_RUN' | tee "$STATUS_FILE"
            echo 'LAST_STAGE=before_arm32_diagnostic' >> "$STATUS_FILE"
          fi
          {
            echo '### UTM Nokia N95 — ARM32 TCI diagnostic'
            echo '- Isolated research branch: research/n95-omap2420-arm32'
            echo '- Pinned UTM: 7eadb056ae0f91d979059544d0ddcd2d5a40be92'
            echo '- Pinned QEMU source: v10.0.12-utm'
            echo '- Original 7 frameworks: read-only integrity audit, SHA256 before/after'
            echo '- TCI/no-JIT; iOS 15.0 minimum; no ESign IPA and no Nokia firmware'
            echo '- iPhone test: **NOT RUN**; N95 machine: **NOT IMPLEMENTED**'
            echo '- Result:'
            echo '~~~'
            cat "$STATUS_FILE"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-N95-ARM32-TCI-DIAGNOSTIC-LOGS
          path: out/arm32-diagnostic/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload experimental ARM32 framework (not an IPA)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QEMU-ARM32-TCI-RESEARCH-FRAMEWORK
          path: out/arm32-diagnostic/framework/
          if-no-files-found: error
          retention-days: 14
