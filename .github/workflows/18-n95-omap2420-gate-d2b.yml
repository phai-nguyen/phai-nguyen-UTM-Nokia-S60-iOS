name: NOKIA-N95-GATE-D2B-OMAP2420-UART1-MMIO

# Linux host diagnostic; builds pinned QEMU10 with independent OMAP UART
# test machine. Does NOT build an iOS IPA or emulate Nokia N95 firmware.
on:
  push:
    branches:
      - research/n95-omap2420-gate-d2b
    paths:
      - .github/workflows/18-n95-omap2420-gate-d2b.yml
      - scripts/test_omap2420_uart_gate_d2b.sh
      - tests/omap2420/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n95-omap2420-gate-d2b
  cancel-in-progress: true

jobs:
  omap2420-d2b:
    name: Gate D2b - ARM1136 real QEMU 16550 UART1 MMIO and OMAP regs
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout separate QEMU ARM1136 OMAP UART research branch
        uses: actions/checkout@v4

      - name: Install QEMU10 compiler and ARMv6 toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl wget xz-utils python3 python3-venv python3-pip \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          python3 -m venv /tmp/qemu-gate-d2b-venv
          /tmp/qemu-gate-d2b-venv/bin/pip install 'meson>=1.6,<2'
          /tmp/qemu-gate-d2b-venv/bin/meson --version

      - name: Build patched pinned QEMU10 and run UART1 serial plus regression gates
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/tmp/qemu-gate-d2b-venv/bin:$PATH"
          bash scripts/test_omap2420_uart_gate_d2b.sh
          grep -Fx 'GATE_D2B_STATUS=PASS' out/omap2420-d2b/diagnostics/BUILD-STATUS.txt
          grep -Fx 'D2B_REAL_OMAP2420_UART1_TX_DEVICE_RUNTIME=PASS' out/omap2420-d2b/diagnostics/runtime-status.txt
          grep -Fx 'D2A_BASELINE_REGRESSION=PASS' out/omap2420-d2b/diagnostics/regression-status.txt
          grep -Fx 'D2B_RAM_GUARD=PASS' out/omap2420-d2b/diagnostics/regression-status.txt

      - name: Summary with precise implemented device boundaries
        if: always()
        shell: bash
        run: |
          mkdir -p out/omap2420-d2b/diagnostics
          {
            echo '## Gate D2b OMAP2420 UART1 — pinned QEMU v10.0.12'
            echo '- Machine omap2420-uartdiag; ARM1136 CPU, SRAM/SDRAM, UART1 MMIO 0x4806a000'
            echo '- QEMU 16550 serial-mm UART TX via real -serial stdio, OMAP2 vendor registers subset'
            echo '- Not fake UART using semihosting: SYS_EXIT uses semihosting only for process termination'
            echo '- D2a CPU+memory regression tested, and invalid RAM size is rejected'
            echo '- UART RX not tested; interrupt line not routed to OMAP2 INTC; clocks/timers not implemented'
            echo '- Not Nokia N95 machine or Symbian boot; Linux-host CI only, no IPA'
            echo '- UTM SE Lite v8/v9 iPhone baseline unmodified'
            echo '### Status'
            echo '~~~'
            cat out/omap2420-d2b/diagnostics/BUILD-STATUS.txt 2>/dev/null || echo 'STATUS=NOT_STARTED'
            cat out/omap2420-d2b/diagnostics/runtime-status.txt 2>/dev/null || true
            cat out/omap2420-d2b/diagnostics/regression-status.txt 2>/dev/null || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete UART and QEMU build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N95-OMAP2420-GATE-D2B-UART1-DIAGNOSTIC-LOGS
          path: out/omap2420-d2b/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload open ARMv6 baremetal UART ELF test payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMAP2420-D2B-ARM1136-UART1-TEST-ELF
          path: out/omap2420-d2b/payload/
          if-no-files-found: warn
          retention-days: 14
